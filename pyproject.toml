[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-self-audit"
version = "1.0.0"
description = "Arc Audit — the $9/mo paid Arc Audit report engine for the Arc Singularity concept."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"

[project.scripts]
arc-audit = "arc_audit.main"

[tool.setuptools]
py-modules = ["arc_audit"]
