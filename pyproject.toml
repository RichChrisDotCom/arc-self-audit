[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-self-audit"
version = "1.0.0"
description = "Digital Arc Self-Audit — a 60-second self-audit of your digital footprint."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"

[project.scripts]
arc-audit = "arc_audit:main"

[tool.setuptools]
py-modules = ["arc_audit"]
